name: CI

on:
  push:
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,intelligence]"
      - run: python -m intelligence.ml_service.train --task cvd --version 1.0.0 --out intelligence/_artifacts
      - run: pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caresense_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      MYSQL_DATABASE: caresense_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -e ".[dev,intelligence]"
      - run: python -m intelligence.ml_service.train --task cvd --version 1.0.0 --out intelligence/_artifacts
      - run: pytest -q
