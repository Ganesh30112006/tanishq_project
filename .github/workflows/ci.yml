# Continuous integration for the whole repository.
#
# This file has to live at the REPOSITORY root. An earlier copy sat at
# Backend/.github/workflows/ci.yml, where GitHub Actions never looks, so it had
# never run once - which is also why the MySQL job below had never proved
# anything despite MySQL being the production target.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so an upstream CDC file that moves is caught before someone
    # needs the pipeline in a hurry.
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,intelligence]"
      # The synthetic demonstration model. Tests that need the NHANES-trained
      # artifact skip when it is absent; the model-pipeline job below builds it.
      - run: python -m intelligence.ml_service.train --task cvd --version 1.0.0 --out intelligence/_artifacts
      - run: pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  backend-mysql:
    name: Backend tests (MySQL 8, the production target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caresense_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      MYSQL_DATABASE: caresense_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -e ".[dev,intelligence]"
      - run: python -m intelligence.ml_service.train --task cvd --version 1.0.0 --out intelligence/_artifacts
      - run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.5"
      # Every substantive rule is enforced. E501 is deferred in pyproject.toml
      # with the reason stated there.
      - run: ruff check .

  migrations-are-complete:
    name: No unmade migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,intelligence]"
      # A model edited without a migration passes every test and then fails on
      # deploy, so this is checked separately and explicitly.
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret

  frontend:
    name: Frontend typecheck, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  model-pipeline:
    name: Model pipeline (NHANES download, train, validate)
    # Downloads ~58 MB from the CDC, so it does not gate every push. It runs
    # weekly and on demand, which is often enough to catch the pipeline rotting
    # or an upstream file moving.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,intelligence]"
      - run: python -m intelligence.ml_service.nhanes_download
      - run: python -m intelligence.ml_service.nhanes_cohort
      - run: python -m intelligence.ml_service.train_nhanes --version 2.3.0 --features deployable
      - run: pytest -q tests/integration/test_nhanes_model.py
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: Backend/intelligence/_artifacts/cvd-2.3.0.meta.json
