          type: string
          description: Present only on a blocked outcome.
        outcome:
          type: string
          description: Machine-readable reason code when blocked.
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    EvidenceGrade:
      type: object
      required: [code, label, detail]
      properties:
        code:
          type: string
          enum: [NOT_CLINICALLY_VALIDATED, INTERNALLY_VALIDATED, EXTERNALLY_VALIDATED]
        label:
          type: string
        detail:
          type: string

    NextStep:
      type: object
      required: [action, label, detail]
      properties:
        action:
          type: string
          enum: [SEE_A_DOCTOR, ADD_RESULTS, KEEP_MONITORING, DISCUSS_SYMPTOMS]
        label:
          type: string
        detail:
          type: string

    RiskInterpretation:
      type: object
      required:
        [band, band_label, headline, what_it_means, what_it_does_not_mean, show_score, evidence_grade, next_steps]
      properties:
        band:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        band_label:
          type: string
        headline:
          type: string
        what_it_means:
          type: string
        what_it_does_not_mean:
          type: string
        horizon:
          type: string
          description: Empty when the model card does not commit to a timeframe.
        prediction_target:
          type: string
        show_score:
          type: boolean
          description: >-
            False when the model has no external validation record, or this
            input failed the reliability check. A lay reader must not be given
            a figure the model card cannot stand behind.
        score_percent:
          type: ["number", "null"]
        score_withheld_reason:
          type: string
        evidence_grade:
          $ref: "#/components/schemas/EvidenceGrade"
        reliability_note:
          type: string
        next_steps:
          type: array
          items:
            $ref: "#/components/schemas/NextStep"

    DataGap:
      type: object
      required: [feature, label, source, how_to_supply]
      properties:
        feature:
          type: string
        label:
          type: string
        source:
          type: string
          enum: ["", LAB_REPORT, MEASUREMENT, PROFILE]
        how_to_supply:
          type: string

    BlockedExplanation:
      type: object
      required: [outcome, headline, detail, data_needed, resolvable_by_patient]
      properties:
        outcome:
          type: string
        headline:
          type: string
        detail:
          type: string
        data_needed:
          type: array
          items:
            $ref: "#/components/schemas/DataGap"
        resolvable_by_patient:
          type: boolean

    Notification:
      type: object
      required: [id, category, subject, body, status, created_at]
      properties:
        id:
          type: string
        category:
          type: string
        subject:
          type: string
        body:
          type: string
        priority:
          type: string
        status:
          type: string
        related_resource_type:
          type: string
        related_resource_id:
          type: string
        created_at:
          type: string
          format: date-time
        read_at:
          type: ["string", "null"]
          format: date-time

    PaginatedNotificationList:
      type: object
      required: [count, page, page_size, num_pages, results]
      properties:
        count:
          type: number
        page:
          type: number
        page_size:
          type: number
        num_pages:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
